<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Asset Viewer</title>
  <style>
    html,body{margin:0;background:#20242b;color:#e8eef5;font:12px system-ui,sans-serif}
    #grid{display:grid;grid-template-columns:repeat(var(--cols,4),1fr);gap:4px;padding:4px}
    .tile{position:relative;background:#2b313a}
    .tile canvas{display:block;width:100%}
    .tile .l{position:absolute;left:4px;top:2px;text-shadow:0 1px 2px #000;font-weight:600}
  </style>
</head>
<body>
  <div id="grid"></div>
  <script type="module" src="/src/tools/viewer.ts"></script>
</body>
</html>
